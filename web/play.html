<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>acweb play</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #login { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.7); z-index: 5; }
    #login form { background: #1b1f26; padding: 20px 24px; border-radius: 8px; display: grid; gap: 8px; min-width: 320px; }
    #login label { display: grid; gap: 2px; font-size: 12px; opacity: .85; }
    #login input, #login button { font: inherit; padding: 6px 8px; }
    #chars { display: grid; gap: 4px; }
    #chars button { text-align: left; }
    #hud { position: fixed; left: 10px; bottom: 10px; width: min(600px, calc(100vw - 480px)); min-width: 320px; z-index: 3; display: none; }
    #hud.show { display: block; }
    #chattabs { display: flex; gap: 2px; background: rgba(0,0,0,.45); border-radius: 6px 6px 0 0; padding: 4px 6px 0; }
    #chattabs button { font: inherit; font-size: 12px; background: rgba(255,255,255,.08); color: #ccc; border: 0; border-radius: 4px 4px 0 0; padding: 3px 10px; cursor: pointer; }
    #chattabs button.active { background: rgba(0,0,0,.6); color: #fff; }
    #chattabs button .badge { display: inline-block; min-width: 14px; padding: 0 4px; margin-left: 5px; border-radius: 8px; background: #c33; color: #fff; font-size: 10px; text-align: center; }
    #chattabs button .badge:empty { display: none; }
    #chattabs .spacer { flex: 1; }
    #chattabs .tool { background: none; color: #999; padding: 3px 6px; }
    #chattabs button.hidden-tab { display: none; }
    #chatTabMenu { display: none; position: absolute; right: 6px; margin-top: 2px; z-index: 5; background: rgba(0,0,0,.9); border: 1px solid #555; border-radius: 6px; padding: 8px 10px; font-size: 12px; }
    #chatTabMenu.show { display: block; }
    #chatTabMenu label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; white-space: nowrap; }
    #chatTabMenu h5 { margin: 0 0 4px; font-size: 11px; font-weight: normal; opacity: .6; }
    .chatlog { height: 220px; overflow-y: auto; background: rgba(0,0,0,.6); padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 12.5px; white-space: pre-wrap; resize: vertical; display: none; }
    .chatlog.active { display: block; }
    .chatlog div { padding: 1px 0; }
    .chatlog .name { cursor: pointer; text-decoration: underline dotted; }
    .chatlog .ts { opacity: .45; margin-right: 6px; font-size: 11px; }
    #chatin { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; background: rgba(0,0,0,.75); color: #eee; border: 1px solid #444; border-radius: 0 0 6px 6px; }
    .c-speech { color: #e8e8e8; } .c-tell { color: #f6c0f6; } .c-outtell { color: #d9a0d9; } .c-system { color: #9ec7ff; }
    .c-broadcast { color: #ffd27a; } .c-emote { color: #b8e0a0; } .c-error { color: #ff8b8b; } .c-debug { color: #777; }
    .c-combat { color: #ffb070; } .c-magic { color: #a0c8ff; } .c-you { color: #ffffff; font-weight: 600; }
    .c-general { color: #c8e6ff; } .c-trade { color: #ffe0a8; } .c-lfg { color: #d0ffd0; } .c-allegiance { color: #ffc8f0; }
    #target { position: fixed; top: 108px; left: 10px; z-index: 3; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; display: none; cursor: move; }
    #target.show { display: block; }
    #target button { font: inherit; margin-left: 6px; }
    #inv.show { display: block; }
    .item { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
    .item:hover { background: rgba(255,255,255,.08); } .item.sel { background: rgba(120,160,255,.25); }
    .item img { width: 24px; height: 24px; image-rendering: pixelated; }
    .item .eq { opacity: .6; font-size: 11px; }
    #vitals { position: fixed; top: 34px; left: 10px; z-index: 3; width: 200px; display: none; font-size: 11px; cursor: move; }
    #vitals .vital { position: relative; height: 16px; margin-bottom: 4px; background: rgba(0,0,0,.55); border-radius: 4px; overflow: hidden; }
    #vitals .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transition: width .25s; }
    #vitals .hp { background: #b3302f; } #vitals .st { background: #b08a1e; } #vitals .mn { background: #2f5fb3; }
    #vitals span, #vitals em { position: relative; line-height: 16px; padding: 0 6px; color: #fff; text-shadow: 0 0 2px #000; font-style: normal; }
    #vitals em { float: right; }
    #jumpbar { position: fixed; left: 50%; top: 40px; width: 220px; height: 10px; margin-left: -110px; background: rgba(0,0,0,.6); border: 1px solid #888; border-radius: 3px; display: none; z-index: 3; }
    #jumpbar div { height: 100%; width: 0; background: #e0c040; transition: width .05s linear; }
    #char { position: fixed; top: 40px; right: 10px; width: 466px; max-height: 78vh; display: none; flex-direction: column; z-index: 4; background: rgba(0,0,0,.72); border-radius: 6px; overflow: hidden; }
    #char.show { display: flex; }
    #charTabs { display: flex; align-items: center; gap: 2px; padding: 4px 6px; white-space: nowrap; background: rgba(255,255,255,.06); cursor: move; }
    #charTabs button { font: inherit; font-size: 11px; background: rgba(255,255,255,.08); color: #ccc; border: 0; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
    #charTabs button.active { background: rgba(255,255,255,.22); color: #fff; }
    #charTabs .spacer { flex: 1; }
    #charTabs .tool { background: none; color: #999; }
    .cpane { display: none; padding: 10px; overflow-y: auto; }
    .cpane.active { display: block; }
    .cpane h3.who { margin: 0; font-size: 14px; }
    .cpane h4 { margin: 10px 0 4px; font-size: 12px; color: #dfc98a; }
    .cpane h4:first-child { margin-top: 0; }
    .cpane .note { margin: 8px 0 0; font-size: 11px; opacity: .65; }
    .cpane input[type=text], .cpane input:not([type]) { width: 100%; box-sizing: border-box; margin-bottom: 6px; font: inherit; font-size: 12px; padding: 3px 6px; background: rgba(255,255,255,.08); color: #eee; border: 1px solid #555; border-radius: 4px; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 12px; }
    .kv b { font-weight: normal; opacity: .8; }
    .kv span { text-align: right; }
    .kv .span2 { grid-column: 1 / -1; }
    .kv .spec { color: #8fd08f; }
    .kv.act { grid-template-columns: 1fr auto auto; }
    .raise { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; min-width: 64px; }
    .raise i { font-style: normal; font-size: 10px; opacity: .55; }
    .raise button { font: inherit; font-size: 11px; line-height: 1; padding: 2px 6px; border: 0; border-radius: 3px; background: #4a6b3f; color: #fff; cursor: pointer; }
    .raise button:disabled { background: rgba(255,255,255,.08); color: #777; cursor: default; }
    .raise.atcap { font-size: 10px; opacity: .45; }
    .doll { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .doll .slot { background: rgba(255,255,255,.05); border-radius: 4px; padding: 4px; text-align: center; }
    .doll .slot b { display: block; font-size: 9px; font-weight: normal; opacity: .55; margin-bottom: 2px; }
    .doll .slot.filled { background: rgba(223,201,138,.14); }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
    .tile img { width: 32px; height: 32px; image-rendering: pixelated; }
    .tile.empty { height: 46px; }
    .tile span { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile.spell { flex-direction: row; gap: 8px; font-size: 12px; padding: 2px 0; }
    .tile.spell span { max-width: none; }
    #cp-itemlist { max-height: 46vh; overflow-y: auto; }
    #cp-itemlist .item { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    #cp-itemlist .item:hover { background: rgba(255,255,255,.08); }
    #cp-itemlist .item.sel { background: rgba(223,201,138,.25); }
    #cp-itemlist .item img { width: 24px; height: 24px; image-rendering: pixelated; }
    #cp-itemlist .item .eq { margin-left: auto; font-size: 10px; opacity: .6; }
    #itemActions { display: flex; gap: 6px; margin-top: 8px; }
    #itemActions button, .cpane > button { font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; }
    .setting { display: grid; grid-template-columns: 1fr 130px 44px; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
    .setting b { font-weight: normal; opacity: .85; }
    .setting i { font-style: normal; text-align: right; opacity: .7; font-size: 11px; }
    .setting small { grid-column: 1 / -1; opacity: .5; font-size: 10px; }
    .setting input[type=checkbox] { justify-self: start; }
    .motd { font-size: 12px; font-style: italic; opacity: .85; margin: 6px 0; }
    /* retail's own windows: the 800x600 screen every layout is authored against */
    #retailui { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; image-rendering: pixelated; }
    #radar { position: fixed; top: 60px; right: 10px; width: 220px; height: 246px; min-width: 150px; min-height: 176px; max-width: 90vw; max-height: 90vh; display: none; flex-direction: column; z-index: 5; background: rgba(0,0,0,.72); border-radius: 6px; overflow: hidden; resize: both; }
    #radar.show { display: flex; }
    #radarHead { display: flex; align-items: center; gap: 4px; padding: 4px 6px; background: rgba(255,255,255,.06); cursor: move; font-size: 12px; }
    #radarHead .spacer { flex: 1; }
    #radarHead .tool { font: inherit; background: none; color: #bbb; border: 0; cursor: pointer; padding: 0 3px; }
    #radarHead .tool:hover { color: #fff; }
    #radarRange { font-size: 11px; color: #9cf; font-family: ui-monospace, monospace; }
    #radarCanvas { flex: 1; width: 100%; min-height: 0; display: block; cursor: crosshair; }
    #vendor { position: fixed; top: 60px; left: 50%; margin-left: -210px; width: 420px; max-height: 70vh; display: none; flex-direction: column; z-index: 5; background: rgba(0,0,0,.82); border-radius: 6px; overflow: hidden; }
    #vendor.show { display: flex; }
    #vendorHead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(255,255,255,.06); cursor: move; font-size: 13px; }
    #vendorHead .spacer { flex: 1; }
    #vendorHead .tool { font: inherit; background: none; color: #999; border: 0; cursor: pointer; }
    #vendorCoins { font-size: 12px; color: #ffd27a; }
    #vendorTabs { display: flex; gap: 2px; padding: 4px 8px 0; }
    #vendorTabs button { font: inherit; font-size: 12px; padding: 3px 12px; border: 0; border-radius: 4px 4px 0 0; background: rgba(255,255,255,.08); color: #ccc; cursor: pointer; }
    #vendorTabs button.active { background: rgba(255,255,255,.2); color: #fff; }
    #vendorList { overflow-y: auto; padding: 6px 8px; font-size: 12px; flex: 1; }
    .vrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .vrow img { width: 24px; height: 24px; image-rendering: pixelated; flex: none; }
    .vrow .vname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vrow .vprice { color: #ffd27a; font-family: ui-monospace, monospace; min-width: 56px; text-align: right; }
    .vrow input[type=number] { width: 52px; font: inherit; font-size: 12px; background: rgba(255,255,255,.08); color: #eee; border: 1px solid #555; border-radius: 3px; padding: 1px 3px; }
    #vendorFoot { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; }
    #vendorFoot span { flex: 1; }
    #vendorFoot button { font: inherit; font-size: 12px; padding: 3px 14px; border: 0; border-radius: 4px; background: #4a6b3f; color: #fff; cursor: pointer; }
    #vendorFoot button:disabled { background: rgba(255,255,255,.08); color: #777; cursor: default; }
    #spellbar { position: fixed; right: 10px; bottom: 52px; z-index: 4; display: none; background: rgba(0,0,0,.6); border-radius: 6px; padding: 4px 6px; cursor: move; max-width: 470px; }
    #spellbar.show { display: block; }
    #sbTabs { display: flex; align-items: center; gap: 2px; margin-bottom: 4px; }
    #sbTabs button { font: inherit; font-size: 10px; min-width: 20px; padding: 1px 5px; background: rgba(255,255,255,.1); color: #ccc; border: 0; border-radius: 3px; cursor: pointer; }
    #sbTabs button.active { background: #dfc98a; color: #222; }
    #sbTabs button.mode.on { background: #6a4fb0; color: #fff; }
    #sbTabs .spacer { flex: 1; }
    #sbSlots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 36px; }
    #sbSlots .sb { position: relative; width: 34px; height: 34px; border-radius: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); cursor: pointer; padding: 0; }
    #sbSlots .sb img { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
    #sbSlots .sb.queued { outline: 2px solid #8fd08f; }
    #sbSlots .sb.casting { outline: 2px solid #ffd27a; }
    #sbSlots .sb .n { position: absolute; left: 2px; top: 0; font-size: 9px; color: #fff; text-shadow: 0 0 2px #000; pointer-events: none; }
    #sbSlots .empty { font-size: 11px; opacity: .6; padding: 8px 4px; }
    .spellrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .spellrow button { font: inherit; font-size: 11px; line-height: 1; padding: 2px 7px; border: 0; border-radius: 3px; background: #4a6b3f; color: #fff; cursor: pointer; }
    #sbStatus { font-size: 11px; opacity: .85; margin-top: 3px; min-height: 14px; }
    #btnBuffs { font: inherit; font-size: 12px; margin-right: 4px; background: rgba(255,255,255,.12); color: #bbb; border: 0; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
    #btnBuffs.has { background: #3f5f8f; color: #fff; }
    #buffList { display: none; position: absolute; right: 0; top: calc(100% + 4px); width: 290px; max-height: 60vh; overflow-y: auto; background: rgba(0,0,0,.86); border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: default; white-space: normal; }
    #buffList.show { display: block; }
    #buffList .buff { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    #buffList .buff img { width: 20px; height: 20px; image-rendering: pixelated; flex: none; }
    #buffList .buff .t { margin-left: auto; font-family: ui-monospace, monospace; opacity: .85; flex: none; }
    #buffList .buff.surpassed { opacity: .45; }
    #buffList .buff.low .t { color: #ffb070; }
    #panelbar { position: fixed; right: 10px; bottom: 10px; z-index: 4; display: flex; align-items: center; gap: 3px; background: rgba(0,0,0,.55); border-radius: 6px; padding: 4px 6px; cursor: move; white-space: nowrap; }
    #panelbar button { font: inherit; font-size: 11px; background: rgba(255,255,255,.1); color: #ddd; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    #panelbar button:hover { background: rgba(255,255,255,.2); }
    #panelbar button.active { background: #dfc98a; color: #222; }
    #status { position: fixed; top: 8px; left: 10px; font-family: ui-monospace, monospace; font-size: 12px; opacity: .85; z-index: 3; white-space: pre; }
    #tools { position: fixed; top: 8px; right: 10px; z-index: 3; background: rgba(0,0,0,.35); padding: 3px 4px; border-radius: 6px; cursor: move; white-space: nowrap; }
    .grip { display: inline-block; color: #999; padding: 0 6px; cursor: move; user-select: none; font-size: 12px; }
    #chattabs { cursor: move; }
    .err { color: #f77; }
  </style>
</head>
<body>
  <div id="login">
    <form id="loginForm">
      <strong>acweb — connect to an ACE server</strong>
      <label>relay <input id="relay" value="ws://127.0.0.1:8001/"></label>
      <label>server host <input id="host" value="play.coldeve.ac"></label>
      <label>port <input id="port" value="9000"></label>
      <label>account <input id="account" autocomplete="username"></label>
      <label>password <input id="password" type="password" autocomplete="current-password"></label>
      <button type="submit" id="connect">Connect</button>
      <div id="loginStatus"></div>
      <div id="chars"></div>
      <details id="create" style="display:none">
        <summary>Create a character</summary>
        <div style="display:grid;gap:6px;margin-top:6px">
          <label>name <input id="cName" maxlength="32"></label>
          <label>heritage <select id="cHeritage"></select></label>
          <label>gender <select id="cGender"><option value="1">Male</option><option value="2">Female</option></select></label>
          <label>template <select id="cTemplate"></select></label>
          <div id="cTemplateInfo" style="font-size:11px;opacity:.8;white-space:pre-wrap"></div>
          <label>start town <select id="cStart"></select></label>
          <button type="button" id="cCreate">Create</button>
        </div>
      </details>
    </form>
  </div>
  <div id="status"></div>
  <div id="panelbar">
    <span class="grip" title="drag">⋮⋮</span>
    <button type="button" data-panel="doll" title="equipped items (C)">Character</button>
    <button type="button" data-panel="status" title="level, experience, burden and more">Status</button>
    <button type="button" data-panel="skills" title="skills and training">Skills</button>
    <button type="button" data-panel="spells" title="spellbook">Spells</button>
    <button type="button" data-panel="items" title="inventory (I)">Items</button>
    <button type="button" data-panel="alleg" title="allegiance">Allegiance</button>
    <button type="button" data-panel="settings" title="client settings">Settings</button>
    <button type="button" id="btnRadar" title="nearby players, NPCs and monsters">Radar</button>
  </div>
  <div id="vendor">
    <div id="vendorHead"><span class="grip" title="drag">⋮⋮</span><b id="vendorName">Vendor</b><span class="spacer"></span><span id="vendorCoins"></span><button type="button" id="vendorClose" class="tool" title="close">×</button></div>
    <div id="vendorTabs"><button type="button" data-vtab="buy" class="active">Buy</button><button type="button" data-vtab="sell">Sell</button></div>
    <div id="vendorList"></div>
    <div id="vendorFoot"><span id="vendorTotal"></span><button type="button" id="vendorGo">Buy</button></div>
  </div>
  <canvas id="retailui" width="800" height="600"></canvas>
  <div id="radar">
    <div id="radarHead"><span class="grip" title="drag">⋮⋮</span><b>Radar</b><span class="spacer"></span><span id="radarRange"></span><button type="button" id="radarOut" class="tool" title="zoom out">−</button><button type="button" id="radarIn" class="tool" title="zoom in">+</button><button type="button" id="radarNorth" class="tool" title="heading up (click for north up)">▲</button><button type="button" id="radarClose" class="tool" title="close">×</button></div>
    <canvas id="radarCanvas"></canvas>
  </div>
  <div id="spellbar">
    <div id="sbTabs"></div>
    <div id="sbSlots"></div>
    <div id="sbStatus"></div>
  </div>
  <div id="jumpbar"><div></div></div>
  <div id="vitals">
    <div class="vital"><div class="bar hp"></div><span>Health</span><em id="vHealth">-</em></div>
    <div class="vital"><div class="bar st"></div><span>Stamina</span><em id="vStamina">-</em></div>
    <div class="vital"><div class="bar mn"></div><span>Mana</span><em id="vMana">-</em></div>
  </div>
  <div id="tools"><span class="grip" title="drag">⋮⋮</span><button id="btnBuffs" type="button" title="active buffs">✦ 0</button><button id="btnBlink" type="button" title="jump one landblock in the direction you face (/blink)">Blink ▶</button><div id="buffList"></div></div>
  <div id="target"><span id="targetName"></span><button id="btnUse" type="button">Use (U)</button><button id="btnGive" type="button">Give item</button><button id="btnClear" type="button">×</button></div>
  <div id="char">
    <div id="charTabs">
      <span class="grip" title="drag">⋮⋮</span>
      <button type="button" data-ctab="doll" class="active">Character</button>
      <button type="button" data-ctab="status">Status</button>
      <button type="button" data-ctab="skills">Skills</button>
      <button type="button" data-ctab="spells">Spells</button>
      <button type="button" data-ctab="items">Inventory</button>
      <button type="button" data-ctab="alleg">Allegiance</button>
      <button type="button" data-ctab="settings">Settings</button>
      <span class="spacer"></span>
      <button type="button" id="charClose" class="tool" title="close (C)">×</button>
    </div>
    <div class="cpane active" id="cp-doll"></div>
    <div class="cpane" id="cp-status"></div>
    <div class="cpane" id="cp-skills"></div>
    <div class="cpane" id="cp-spells"></div>
    <div class="cpane" id="cp-items">
      <div id="cp-itemlist"></div>
      <div id="itemActions"><button id="itemUse" type="button">Use</button><button id="itemEquip" type="button">Equip</button><button id="itemGive" type="button">Give to target</button><button id="itemDrop" type="button">Drop</button></div>
    </div>
    <div class="cpane" id="cp-alleg"></div>
    <div class="cpane" id="cp-settings"></div>
  </div>
  <div id="hud">
    <div id="chattabs"><span class="grip" title="drag the chat window">⋮⋮</span>
      <button type="button" data-tab="all" class="active">All<span class="badge"></span></button>
      <button type="button" data-tab="chat">Chat<span class="badge"></span></button>
      <button type="button" data-tab="general">General<span class="badge"></span></button>
      <button type="button" data-tab="trade">Trade<span class="badge"></span></button>
      <button type="button" data-tab="lfg">LFG<span class="badge"></span></button>
      <button type="button" data-tab="combat">Combat<span class="badge"></span></button>
      <button type="button" data-tab="system">System<span class="badge"></span></button>
      <button type="button" data-tab="debug">Debug<span class="badge"></span></button>
      <span class="spacer"></span>
      <button type="button" class="tool" id="chatTabsCfg" title="choose which chat tabs to show">⚙</button>
      <button type="button" class="tool" id="chatTs" title="toggle timestamps">🕒</button>
